<!DOCTYPE html>
<html>
<head><title>Duke Nukem 3D</title><style>html,body{margin:0;background:#000;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;}#canvas{width:100vw;height:100vh;object-fit:contain;}#status{position:absolute;top:20px;color:#ffcc00;font-family:monospace;font-size:22px;z-index:99;}</style></head>
<body>
<div id="status">Loading Duke Nukem 3D...</div>
<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
<script>
var statusElement = document.getElementById("status");
var Module = {
  canvas: document.getElementById("canvas"),
  arguments: ["-nostartup"],
  addRunDependency: function(id) { if (statusElement) statusElement.innerHTML = "Mounting 43 MB game assets..."; },
  removeRunDependency: function(id) { if (statusElement) statusElement.style.display = "none"; },
  setStatus: function(text) { if (statusElement && text) statusElement.innerHTML = text; }
};
</script>
<script src="duke.data.js"></script>
<script src="chocolate-duke3d.js"></script>
</body>
</html>
