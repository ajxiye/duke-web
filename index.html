<!DOCTYPE html>
<html>
<head><title>Duke Nukem 3D v1.0.0</title><style>html,body{margin:0;background:#000;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;}#canvas{width:100vw;height:100vh;object-fit:contain;}#status{position:absolute;top:20px;color:#ffcc00;font-family:monospace;font-size:22px;z-index:99;}</style>
<script id="duke-auto-version">
(async function () {
  document.title = "Duke Nukem 3D v1.0.0";

  try {
    const response = await fetch(
      "https://api.github.com/repos/ajxiye/duke-web/commits?per_page=1",
      { cache: "no-store" }
    );

    if (!response.ok) return;

    const link = response.headers.get("Link") || "";
    const match = link.match(
      /<[^>]*[?&]page=(\d+)[^>]*>;\s*rel="last"/
    );

    const total = match ? Number(match[1]) : 1;
    const version = Math.max(0, total - 11);

    document.title = `Duke Nukem 3D v1.0.${version}`;
  } catch (_) {}
})();
</script>
</head>
<body>
<div id="status">Loading Duke Nukem 3D...</div>
<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
<script>
var statusElement = document.getElementById("status");
var Module = {
  canvas: document.getElementById("canvas"),
  arguments: [],
  setStatus: function(text) {
    if (statusElement) {
      if (text) statusElement.innerHTML = text;
      else statusElement.style.display = "none";
    }
  }
};
</script>
<script src="chocolate-duke3d.js"></script>
</body>
</html>
